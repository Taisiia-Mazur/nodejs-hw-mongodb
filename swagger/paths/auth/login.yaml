tags:
  - Auth
summary: Login user
operationId: LoginUser
description: 'Login user'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            description: "User's email"
            type: string
            example: 'contact@mail.to'
          password:
            description: "User's password"
            type: string
            example: 'bbb124aa369'
responses:
  '201':
    description: 'Successfully logged in a user!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully logged in a user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'zTI9FhYNNLjx8r7jUQjlmI431YO9iL9iU9rGUMpt'
  '400':
    $ref: '../../components/responses/400.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
