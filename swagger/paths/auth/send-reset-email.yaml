tags:
  - Auth
summary: Reset password email
operationId: ResetPasswordEmail
description: 'Reset password email'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            description: "User's email"
            type: string
            example: 'contact@mail.to'
responses:
  '200':
    description: 'Reset password email was successfully sent!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email was successfully sent!'
            data:
              type: object
              $ref: '../../components/schemas/user.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
