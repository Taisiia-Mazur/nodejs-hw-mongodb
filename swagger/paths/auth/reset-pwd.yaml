tags:
  - Auth
summary: Reset password
operationId: ResetPassword
description: 'Reset password'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            description: "User's token"
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzNkZmUxNjczZGZiNDBmYzQ0YzA1NjUiLCJlbWFpbCI6InRhaXNpaWFfbUBtZXRhLnVhIiwiaWF0IjoxNzMyMTcxNjQ3LCJleHAiOjE3MzIxNzI1NDd9.jF6vaFK2sH_ds0KN0X28PD4Y9WqasBA38jszpwt0TkI'
          password:
            description: "User's new password.Enter new password."
            type: string
            example: '55dd88ww'
responses:
  '200':
    description: 'Password has been successfully reset!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset!
            data:
              type: object
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
