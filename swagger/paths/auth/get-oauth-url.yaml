tags:
  - Auth
summary: Get Google OAuth url
operationId: GetGoogleOAuthUrl
description: 'Get Google OAuth url'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Successfully get Google OAuth url!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get Google OAuth url!
            data:
              type: object
              required:
                - url
              properties:
               url:
                type: string
                example: "https://accounts.google.com/o/oauth2/v2/auth?scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile&response_type=code&client_id=407502045957-hqp0nort67o30fn3miqb9b23ip1fmr9h.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fconfirm-google-auth"
  '404':
    description: Session not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Session not found error
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Session not found'
  '401':
    description: Session token expired
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Session token expired error
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Session token expired'
  '500':
    $ref: '../../components/responses/500.yaml'
